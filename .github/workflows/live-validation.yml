name: Live validation

on:
  workflow_dispatch:
    inputs:
      host:
        description: Installed native host
        required: true
        type: choice
        options: [claude, codex, hermes]
      model:
        description: Exact model identifier
        required: true
        type: string
      os:
        description: Runner operating system
        required: true
        type: choice
        options: [linux, macos, windows]
      baseline_ref:
        description: Reviewed main-history commit SHA
        required: true
        type: string
      baseline_digest:
        description: SHA-256 of git archive --format=tar <SHA> -- core evals profiles skills
        required: true
        type: string
      attempts:
        description: Required serial attempts (1 through 25)
        required: true
        type: number
        default: 1
      timeout_minutes:
        description: Maximum live duration in minutes (1 through 15)
        required: true
        type: number
        default: 5
      allow_paid:
        description: Authorize paid provider calls for this run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: axiom-live-validation
  cancel-in-progress: false

jobs:
  live:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ${{ inputs.os == 'linux' && 'ubuntu-latest' || inputs.os == 'macos' && 'macos-latest' || 'windows-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Stage the pinned Claude Code executable
        if: inputs.allow_paid && inputs.host == 'claude' && inputs.os == 'linux'
        run: npm install --ignore-scripts --prefix "$RUNNER_TEMP/axiom-native" @anthropic-ai/claude-code-linux-x64@2.1.330
      - name: Qualify selected installed host
        run: node tests/ci/live.mts
        env:
          AXIOM_HOST: ${{ inputs.host }}
          AXIOM_MODEL: ${{ inputs.model }}
          AXIOM_OS: ${{ inputs.os }}
          AXIOM_BASELINE_REF: ${{ inputs.baseline_ref }}
          AXIOM_BASELINE_DIGEST: ${{ inputs.baseline_digest }}
          AXIOM_ATTEMPTS: ${{ inputs.attempts }}
          AXIOM_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
          AXIOM_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          AXIOM_ALLOW_PAID: ${{ inputs.allow_paid }}
          AXIOM_CLAUDE_PROGRAM: ${{ runner.temp }}/axiom-native/node_modules/@anthropic-ai/claude-code-linux-x64/claude
          ANTHROPIC_API_KEY: ${{ inputs.allow_paid && inputs.host == 'claude' && inputs.os == 'linux' && secrets.AXIOM_ANTHROPIC_API_KEY || '' }}
      - name: Upload curated disposition
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: axiom-live-summary
          path: ${{ runner.temp }}/axiom-live-summary.json
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required installed-host evidence
    needs: live
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          LIVE_RESULT: ${{ needs.live.result }}
        run: test "$LIVE_RESULT" = success
